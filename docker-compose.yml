services:
  app1:
    image: danttera/rinha-2026-novo:latest
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 150mb
          cpus: "0.4"

  app2:
    image: danttera/rinha-2026-novo:latest
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"] 
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 150mb
          cpus: "0.4"

  nginx:
    image: nginx:alpine
    ports:
      - "9999:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 50mb
          cpus: "0.2"