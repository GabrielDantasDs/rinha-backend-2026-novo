services:
  app1:
    image: danttera/rinha-2026-novo:latest
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    expose:
      - "8080"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s


  app2:
    image: danttera/rinha-2026-novo:latest
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    expose:
      - "8080"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"] 
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    deploy:


  nginx:
    image: nginx:alpine
    ports:
      - "9999:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    networks:
      - backend


networks:
  backend:
    driver: bridge