services:
  app1:
    image: danttera/rinha-2026-novo:latest
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    expose:
      - "8080"
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 150mb
          cpus: "0.4"

  app2:
    image: danttera/rinha-2026-novo:latest
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    expose:
      - "8080"
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 150mb
          cpus: "0.4"

  nginx:
    image: nginx:alpine
    ports:
      - "9999:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 50mb
          cpus: "0.2"

networks:
  backend:
    driver: bridge